# Pocket Print Farm (Go + SQLite) — your 3D printers in one place: live state, the queue, models, filament, every print and its cost, upkeep.
services:
  pocket-printfarm:
    image: ghcr.io/abjelosevic88/pocket-homelab-print-farm:latest
    container_name: pocket-printfarm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      # PRINTER_POLL: "10"             # ask connected printers every 10 s (0 = only when a page opens)
      # MAX_UPLOAD_BYTES: "1073741824" # the biggest model file (1 GB)
      # Pocket Core: one sign-in, Pocket AI, and app links to Pocket Files, Inventory, Money, Invoicing, Contacts,
      # Tasks, Calendar, Chat, Parcels, Projects, Home and Alerts.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
