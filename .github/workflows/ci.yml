name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-printfarm ./cmd/pocket-printfarm
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/ppf DEMO_DATA=true AUTH_MODE=none ./pocket-printfarm &
          sleep 4
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/farm | grep -q 'Twisted vase'
          curl -fsS http://localhost:8080/api/v1/summary | grep -q '"low_filament"'
          curl -fsS http://localhost:8080/api/v1/models | grep -q 'Gear, 24 teeth'
          curl -fsS 'http://localhost:8080/api/v1/search?q=planter' | grep -q 'Desk planter'
          curl -fsS http://localhost:8080/api/v1/spools | grep -q 'Galaxy Black'
          curl -fsS http://localhost:8080/api/v1/stats | grep -q '"reasons"'
          curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/files/1/mesh | grep -q 200
          curl -fsS http://localhost:8080/api/v1/models/1/cover | head -c 4 | grep -q PNG
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-printfarm:pr
